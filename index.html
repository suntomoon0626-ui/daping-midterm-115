let state={slots:raw.flatMap((day,d)=>day.flatMap((row,p)=>row.map((v,g)=>({id:`${d}-${p}-${g}`,d,p,g,locked:v.endsWith('*'),subject:v.replace('*','').split('/')[0],teachers:v.includes('/')?v.split('/')[1].split(','):[],pending:false,rev:0})))),exams:{},logs:[],verified:false,version:0},current=null,busy=false;

async function rpc(name,input){
 if(typeof google!=='undefined'&&google.script&&google.script.run){return new Promise((resolve,reject)=>{const r=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);if(name==='getState')r.getState();else if(name==='saveExam')r.saveExam(input);else if(name==='withdrawExam')r.withdrawExam(input);else if(name==='swapLessons')r.swapLessons(input);else if(name==='correctLesson')r.correctLesson(input);else if(name==='confirmTimetable')r.confirmTimetable(input);else reject(Error('未知操作'));})}

 const body=document.createElement('tbody');
 const same=(s,t)=>t&&s.locked&&t.locked&&s.subject===t.subject;
 const find=(d,p,g)=>state.slots.find(x=>x.id===`${d}-${p}-${g}`);
 for(let p=0;p<7;p++){

 for(let d=0;d<5;d++)for(const g of grades){

function open(s){if(!allowed(s))return;$('editorStatus').textContent='';current=s;const e=state.exams[s.id];$('editTitle').textContent=`${s.g+1} 年級 · ${days[s.d]} · 第 ${s.p+1} 節`;$('editHint').textContent=`${times[s.p]}｜原課程：${s.subject}｜${s.teachers.join('、')}`;$('subject').value=e?.subject||s.subject;$('range').value=e?.range||'';$('remove').hidden=!e;$('editor').showModal()}

$('swap').onclick=async()=>{const a=state.slots.find(s=>s.id===$('from').value),b=state.slots.find(s=>s.id===$('to').value);if(!a||!b)return;await mutate('swapLessons',{from:a.id,to:b.id,fromRev:a.rev,toRev:b.rev,reason:$('reason').value.trim(),password:$('adminPassword').value})};
